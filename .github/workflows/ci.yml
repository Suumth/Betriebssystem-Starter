name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PM unit tests
        working-directory: ai-betriebssystem/pm
        run: python -m unittest discover -s . -p 'test_*.py' -v

  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run public readiness check
        run: bash scripts/public-readiness-check.sh
