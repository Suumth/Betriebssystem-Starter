name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PM tests
        working-directory: ai-betriebssystem/pm
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Run contract tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run public readiness check
        run: bash scripts/public-readiness-check.sh

  post-setup-scope-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run setup smoke and post-setup scope check
        run: |
          cat > setup.local.env <<EOF
          PROJECT_NAME=CI Scope Check
          GITHUB_OWNER=ExampleOrg
          GITHUB_REPO=ci-scope-check
          PROJECT_REPO_URL=https://github.com/ExampleOrg/ci-scope-check
          AI_VAULT_PATH=$PWD/ai-vault
          LOCAL_CHECKOUT_PATH=$PWD
          AI_OS_METHOD_REPO_URL=https://github.com/example-org/ai-betriebssystem-method
          IMPORT_LABELS=no
          CREATE_TICKET_0=no
          CREATE_VAULT_STRUCTURE=yes
          EOF
          bash scripts/setup.sh </dev/null
          bash scripts/post-setup-check.sh
