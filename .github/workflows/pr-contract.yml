name: PR Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check PR contract
        run: python scripts/pr_contract_check.py
